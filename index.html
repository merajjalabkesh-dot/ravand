<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>روند</title>
    <meta name="theme-color" content="#0a0f1f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="roznegar" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./brand/icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" /></noscript>
    <link rel="stylesheet" href="/src/styles/app-shell.css" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // ---------------------------------------------------------------
      // تشخیص بیلد native: Tauri (exe)، Capacitor (apk) یا origin محلی
      // WebView کپاسیتور از http://localhost سرو می‌شود، پس بدون نیاز به
      // bridge هم از همان اسکریپت اول قابل تشخیص است (بدون race).
      // روی وب (pages.dev) همهٔ این‌ها false می‌مانند.
      // ---------------------------------------------------------------
      window.__rgIsNative = function () {
        var h = location.hostname;
        return !!(
          window.__TAURI_INTERNALS__ ||
          window.Capacitor ||
          // exe (Electron) فایل محلی بسته‌بندی‌شده را از file:// لود می‌کند
          location.protocol === 'file:' ||
          (h === 'localhost' && (location.port === '' || location.port === '80')) ||
          h === 'tauri.localhost'
        );
      };
      window.__IS_NATIVE_APP__ = window.__rgIsNative();

      // داخل اپلیکیشن سایت جایی ندارد: لندینگ/سایت/دانلود حذف و مستقیم
      // پنل ورود می‌رویم؛ اگر کاربر قبلاً وارد شده باشد Login خودش به
      // /app هدایت می‌کند (RedirectIfAuthed).
      var __rgSiteRoutes = { '': 1, '#': 1, '#/': 1, '#/site': 1, '#/download': 1 };
      window.__rgNativeStart = function () {
        if (window.__IS_NATIVE_APP__ && __rgSiteRoutes[location.hash]) {
          location.replace('#/login');
        }
      };
      window.__rgNativeStart();
      window.addEventListener('hashchange', window.__rgNativeStart);

      // bridge کپاسیتور گاهی کمی بعد تزریق می‌شود؛ ۵ ثانیه دوباره چک می‌کنیم
      (function () {
        var t = setInterval(function () {
          if (window.__rgIsNative()) {
            window.__IS_NATIVE_APP__ = true;
            clearInterval(t);
            window.__rgNativeStart();
          }
        }, 50);
        setTimeout(function () { clearInterval(t); }, 5000);
      })();
      localStorage.setItem('theme', 'midnight');

      // ---------------------------------------------------------------
      // حالت standalone (افزودن به صفحهٔ اصلی آیفون): iOS ارتفاع کادرِ
      // position:fixed;inset:0 را به ناحیهٔ زیر نوار وضعیت محدود می‌کند،
      // پس نوار پایین اپ (آخرین فرزند فلکس) از کف صفحه جدا می‌افتد و یک
      // نوار خالی زیرش می‌ماند. اینجا فقط در همین حالت ارتفاع واقعی
      // ویوپورت را صریح روی ریشه می‌گذاریم تا اپ دقیقاً تا کف بنشیند.
      // در مرورگر عادی هیچ کلاسی اضافه نمی‌شود و چیدمان دست‌نخورده می‌ماند.
      // ---------------------------------------------------------------
      (function () {
        var standalone =
          window.navigator.standalone === true ||
          (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
        if (!standalone || window.__IS_NATIVE_APP__) return;
        var root = document.documentElement;
        root.classList.add('rg-standalone');
        var setH = function () {
          // iOS در حالت standalone گاهی innerHeight را کوتاه‌تر از صفحهٔ
          // فیزیکی گزارش می‌کند؛ بزرگ‌ترین مقدار را می‌گیریم تا اپ همیشه
          // تا کف واقعی صفحه بنشیند.
          var h = Math.max(
            window.innerHeight || 0,
            (window.screen && window.screen.height) || 0
          );
          if (h > 0) root.style.setProperty('--rg-app-h', h + 'px');
        };
        setH();
        window.addEventListener('load', setH);
        window.addEventListener('resize', setH);
        window.addEventListener('orientationchange', setH);
      })();

      // ---------------------------------------------------------------
      // ثبت service worker برای نسخهٔ وب (PWA).
      // داخل اپ native (exe/apk) هرگز ثبت نمی‌شود؛ WebView نباید precache کند.
      // مسیر و scope از document.baseURI ساخته می‌شوند تا روی زیرمسیر هم درست باشد.
      // بدون این ثبت، بازگشایی مجدد تبِ اپ آفلاین روی درخواست شبکه معلق می‌ماند.
      // ---------------------------------------------------------------
      if (!window.__IS_NATIVE_APP__ && 'serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          try {
            var swUrl = new URL('service-worker.js', document.baseURI).pathname;
            var scope = new URL('./', document.baseURI).pathname;
            navigator.serviceWorker.register(swUrl, { scope: scope }).catch(function (e) {
              console.warn('SW registration failed', e);
            });
          } catch (e) { console.warn('SW registration failed', e); }
        });
      }
    </script>
    <script type="module" src="./src/main-app.jsx"></script>
  </body>
</html>
