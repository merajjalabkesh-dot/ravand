[package]
name = "ravand"
version = "0.1.3"
description = "روند — عادت‌ها، کارهای روزانه و ژورنال"
authors = ["Ravand"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ravand_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
ureq = "2.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
panic = "abort"
