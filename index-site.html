<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>روند</title>
    <meta name="theme-color" content="#0a0f1f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="روند" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./brand/icon-180.png" />
    <!-- فونت سایت (IRAN) از public/fonts/iran و در site.css بارگذاری می‌شود؛
         لینک Vazirmatn گوگل برای این ورودی لازم نیست. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
    <script>
      // Register the generated service worker (created after vite build).
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          const swUrl = new URL('service-worker.js', document.baseURI).pathname;
          const scope = new URL('./', document.baseURI).pathname;
          navigator.serviceWorker.register(swUrl, { scope: scope }).catch(function (e) {
            console.warn('SW registration failed', e)
          })
        })
      }
    </script>
  </body>
</html>
