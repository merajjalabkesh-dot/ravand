<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>روند</title>
    <meta name="theme-color" content="#0a0f1f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="روند" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" /></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script>
      console.info('[PWA boot]', {
        href: location.href,
        online: navigator.onLine,
        controller: navigator.serviceWorker?.controller?.scriptURL ?? null
      });
      navigator.serviceWorker?.getRegistration().then(reg => {
        console.info('[PWA registration]', {
          scope: reg?.scope, active: reg?.active?.scriptURL, state: reg?.active?.state
        });
      });
    </script>
    <script type="module" src="./src/main.jsx"></script>
    <script>
      // Register the generated service worker (created after vite build).
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          const swUrl = new URL('service-worker.js', document.baseURI).pathname;
          const scope = new URL('./', document.baseURI).pathname;
          navigator.serviceWorker.register(swUrl, { scope: scope }).catch(function (e) {
            console.warn('SW registration failed', e)
          })
        })
      }
    </script>
  </body>
</html>
